name: Deploy LAMP Stack to DigitalOcean

on:
  push:
    branches: [ main ] # Triggers every time you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Navigate to your application folder on the Droplet
            cd /var/www/my-app

            # 2. Pull the latest code changes from GitHub
            git pull origin main

            # 3. Fix permissions so Apache (www-data) can read the new files
            sudo chown -R www-data:www-data /var/www/my-app
            sudo find /var/www/my-app -type d -exec chmod 755 {} \;
            sudo find /var/www/my-app -type f -exec chmod 644 {} \;

            # 4. Reload Apache to clear any cached PHP scripts
            sudo systemctl reload apache2
