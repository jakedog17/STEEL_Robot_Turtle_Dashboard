name: Deploy WWW Folder to DigitalOcean

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy www folder to Droplet via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "www"
          target: "/var/www/html"

      - name: Move Files, Fix Permissions, and Reload Apache
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Move files out of the temporary nested www folder into the root html directory
            sudo cp -r /var/www/html/www/* /var/www/html/
            sudo rm -rf /var/www/html/www
            
            # 2. Fix permissions so Apache (www-data) can read the files
            sudo chown -R www-data:www-data /var/www/html
            sudo find /var/www/html -type d -exec chmod 755 {} \;
            sudo find /var/www/html -type f -exec chmod 644 {} \;
            
            # 3. Reload Apache
            sudo systemctl reload apache2