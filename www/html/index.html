
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEEL Turtle Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #20252b;
            color: white;
            padding: 30px;
        }

        h1, h2 {
            color: #55c2ff;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .device {
            background: #303943;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
        }

        .device h3 {
            color: #55c2ff;
        }

        .status {
            color: #7ee787;
        }

        button {
            padding: 10px 18px;
            background: #1685c5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #08649b;
        }

        #error {
            color: #ff7777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>STEEL Turtle Dashboard</h1>

    <button onclick="getStatus()">Refresh Status</button>

    <p id="error"></p>

    <h2>Motors</h2>
    <div id="motors">
        Loading motors...
    </div>

    <h2>Servos</h2>
    <div id="servos">
        Loading servos...
    </div>

</div>

<script>

    async function getStatus() {

        const errorDisplay = document.getElementById("error");

        errorDisplay.textContent = "";

        try {

            const urlBase = 'http://67.205.143.129/api/';

            const response = await fetch(urlBase + 'getStatus.php', {   
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "UserBoards": {
                        "login": "STEEL_Turtle",
                        "password": "12345678"
                    }
                })
            });

            if (!response.ok) {
                throw new Error("HTTP Error: " + response.status);
            }

            const data = await response.json();

            if (data.error) {
                throw new Error(data.error);
            }

            displayMotors(data.Motors || {});
            displayServos(data.Servos || {});

        } catch (error) {

            errorDisplay.textContent =
                "Error loading board status: " + error.message;

        }
    }


    function displayMotors(motors) {

        const container = document.getElementById("motors");

        container.innerHTML = "";

        for (const motorName in motors) {

            const motor = motors[motorName];

            const device = document.createElement("div");

            device.className = "device";

            const heading = document.createElement("h3");
            heading.textContent = motorName;

            const speed = document.createElement("p");
            speed.textContent = "Speed: " + motor.Speed;

            const direction = document.createElement("p");
            direction.textContent = "Direction: " + motor.Direction;

            device.appendChild(heading);
            device.appendChild(speed);
            device.appendChild(direction);

            container.appendChild(device);
        }

        if (Object.keys(motors).length === 0) {
            container.textContent = "No motors found.";
        }
    }


    function displayServos(servos) {

        const container = document.getElementById("servos");

        container.innerHTML = "";

        for (const servoName in servos) {

            const servo = servos[servoName];

            const device = document.createElement("div");

            device.className = "device";

            const heading = document.createElement("h3");
            heading.textContent = servoName;

            const angle = document.createElement("p");
            angle.textContent = "Angle: " + servo.Angle + "°";

            device.appendChild(heading);
            device.appendChild(angle);

            container.appendChild(device);
        }

        if (Object.keys(servos).length === 0) {
            container.textContent = "No servos found.";
        }
    }


    // Load status when page opens
    getStatus();

</script>

</body>
</html>
